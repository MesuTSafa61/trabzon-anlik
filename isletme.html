<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>İşletme Detayı | Trabzon Anlık</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .business-detail {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .business-detail-card {
            background: #fff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        .business-detail-image {
            width: 100%;
            height: 420px;
            object-fit: cover;
            display: block;
        }

        .business-detail-content {
            padding: 35px;
        }

        .business-detail-category {
            display: inline-block;
            background: #f1f5f9;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .business-detail-title {
            font-size: 38px;
            margin: 0 0 12px;
        }

        .business-detail-rating {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .business-detail-description {
            font-size: 17px;
            line-height: 1.7;
            color: #555;
            margin-bottom: 30px;
        }

        .business-info {
            display: grid;
            gap: 14px;
            margin-bottom: 30px;
        }

        .business-info-item {
            padding: 16px;
            background: #f8fafc;
            border-radius: 14px;
        }

        .business-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .business-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            background: #111827;
            color: white;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #111827;
            font-weight: 600;
        }

        .loading,
        .error {
            text-align: center;
            padding: 80px 20px;
        }

        @media (max-width: 700px) {
            .business-detail {
                margin: 25px auto;
            }

            .business-detail-image {
                height: 260px;
            }

            .business-detail-content {
                padding: 24px;
            }

            .business-detail-title {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="header-content">
            <a href="index.html" class="logo">TRABZON ANLIK</a>

            <nav class="nav">
                <a href="index.html">Ana Sayfa</a>
                <a href="index.html#kategoriler">Kategoriler</a>
                <a href="isletme-ekle.html">İşletmeni Ekle</a>
            </nav>
        </div>
    </header>

    <main class="business-detail">

        <a href="index.html" class="back-button">
            ← Ana Sayfaya Dön
        </a>

        <div id="businessContainer">
            <div class="loading">
                İşletme yükleniyor...
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="isletme.js?v=1"></script>

</body>
</html>
