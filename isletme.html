<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        İşletme Detayı | Trabzon Anlık
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =====================================================
           İŞLETME DETAY SAYFASI
        ===================================================== */

        body {
            background: #f6f8fb;
        }

        .business-detail {
            max-width: 1150px;
            margin: 40px auto 80px;
            padding: 0 20px;
        }


        /* GERİ BUTONU */

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            color: #111827;
            text-decoration: none;
            font-weight: 700;
        }

        .back-button:hover {
            opacity: .7;
        }


        /* ANA KART */

        .business-detail-card {
            background: #ffffff;
            border-radius: 26px;
            overflow: hidden;
            box-shadow:
                0 15px 45px rgba(0,0,0,.08);
        }


        /* FOTOĞRAF */

        .business-detail-image-wrap {
            position: relative;
            width: 100%;
            height: 470px;
            overflow: hidden;
            background: #e5e7eb;
        }

        .business-detail-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }


        /* FOTOĞRAF ÜZERİNDEKİ GRADIENT */

        .business-image-overlay {
            position: absolute;
            inset: auto 0 0 0;
            height: 180px;
            background:
                linear-gradient(
                    to top,
                    rgba(0,0,0,.65),
                    transparent
                );
            pointer-events: none;
        }


        /* FOTOĞRAF ÜZERİNDE KATEGORİ */

        .business-image-category {
            position: absolute;
            left: 25px;
            bottom: 22px;

            display: inline-flex;
            align-items: center;

            padding: 9px 15px;

            border-radius: 999px;

            background: rgba(255,255,255,.94);

            color: #111827;

            font-size: 14px;
            font-weight: 800;
        }


        /* İÇERİK */

        .business-detail-content {
            padding: 36px;
        }


        /* BAŞLIK */

        .business-detail-title {
            margin: 0 0 12px;

            font-size: 42px;
            line-height: 1.15;

            color: #111827;
        }


        /* PUAN */

        .business-detail-rating {
            display: flex;
            align-items: center;
            gap: 12px;

            margin-bottom: 28px;

            color: #475569;
            font-size: 16px;
        }

        .rating-main {
            font-size: 21px;
            font-weight: 800;
            color: #111827;
        }


        /* AÇIKLAMA */

        .business-detail-description {
            margin-bottom: 30px;

            color: #4b5563;

            font-size: 17px;
            line-height: 1.75;
        }


        /* BİLGİLER */

        .business-info {
            display: grid;
            gap: 12px;
            margin-bottom: 30px;
        }

        .business-info-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;

            padding: 16px 18px;

            background: #f8fafc;

            border: 1px solid #eef2f7;

            border-radius: 15px;

            color: #374151;

            line-height: 1.5;
        }

        .business-info-item strong {
            color: #111827;
        }


        /* BUTONLAR */

        .business-actions {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 12px;

            margin-bottom: 20px;
        }

        .business-action {
            display: flex;

            align-items: center;
            justify-content: center;

            min-height: 52px;

            padding: 14px 18px;

            border-radius: 14px;

            text-decoration: none;

            font-weight: 800;

            background: #111827;
            color: white;

            transition:
                transform .2s ease,
                opacity .2s ease;
        }

        .business-action:hover {
            transform: translateY(-2px);
            opacity: .9;
        }

        .business-action.whatsapp {
            background: #16a34a;
        }

        .business-action.instagram {
            background: #7c3aed;
        }

        .business-action.map {
            background: #2563eb;
        }

        .business-action.website {
            background: #475569;
        }


        /* PAYLAŞ */

        .share-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;

            padding-top: 20px;

            border-top:
                1px solid #e5e7eb;
        }

        .share-button {
            border: 0;

            padding: 12px 16px;

            border-radius: 12px;

            background: #f1f5f9;

            color: #111827;

            font-weight: 700;

            cursor: pointer;

            transition: .2s ease;
        }

        .share-button:hover {
            background: #e2e8f0;
        }


        /* HARİTA */

        .business-map {
            margin-top: 28px;

            border-radius: 20px;

            overflow: hidden;

            border: 1px solid #e5e7eb;
        }

        .business-map iframe {
            width: 100%;
            height: 350px;

            display: block;

            border: 0;
        }


        /* YÜKLENİYOR / HATA */

        .loading,
        .error {
            text-align: center;

            padding: 90px 20px;
        }


        /* MOBİL */

        @media (max-width: 700px) {

            .business-detail {
                margin: 25px auto 50px;
                padding: 0 14px;
            }

            .business-detail-image-wrap {
                height: 290px;
            }

            .business-detail-content {
                padding: 24px 20px;
            }

            .business-detail-title {
                font-size: 29px;
            }

            .business-actions {
                grid-template-columns: 1fr;
            }

            .business-map iframe {
                height: 280px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="header-content">

            <a
                href="index.html"
                class="logo"
            >
                TRABZON ANLIK
            </a>


            <nav class="nav">

                <a href="index.html">
                    Ana Sayfa
                </a>

                <a href="index.html#kategoriler">
                    Kategoriler
                </a>

                <a href="isletme-ekle.html">
                    İşletmeni Ekle
                </a>

            </nav>

        </div>

    </header>



    <!-- =====================================================
         ANA İÇERİK
    ====================================================== -->

    <main class="business-detail">


        <a
            href="index.html"
            class="back-button"
        >
            ← Ana Sayfaya Dön
        </a>


        <div id="businessContainer">

            <div class="loading">

                <h2>
                    İşletme yükleniyor...
                </h2>

                <p>
                    Lütfen bekleyin.
                </p>

            </div>

        </div>


    </main>



    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- İŞLETME JS -->

    <script
        src="isletme.js?v=2"
    ></script>


</body>

</html>
