```html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yönetim Paneli | Trabzon Anlık</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background: #f5f6f8;
        }

        .admin-page {
            padding: 50px 0 80px;
            min-height: calc(100vh - 80px);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            gap: 20px;
        }

        .admin-header h1 {
            margin: 0 0 8px;
            color: #101c35;
            font-size: 34px;
        }

        .admin-header p {
            margin: 0;
            color: #777;
        }

        .admin-logo {
            color: #7b1830;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .refresh-button {
            border: 0;
            background: #101c35;
            color: white;
            padding: 12px 18px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
        }

        .applications {
            display: grid;
            gap: 18px;
        }

        .application-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 5px 25px rgba(0,0,0,.06);
        }

        .application-top {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: flex-start;
        }

        .application-title {
            margin: 0 0 7px;
            color: #101c35;
            font-size: 22px;
        }

        .application-meta {
            color: #777;
            font-size: 14px;
            line-height: 1.7;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            background: #fff4d6;
            color: #8a6200;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .approved-status {
            background: #eaf7ee;
            color: #176b35;
        }

        .featured-status {
            background: #fff4d6;
            color: #8a6200;
        }

        .application-details {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 30px;
        }

        .detail strong {
            display: block;
            color: #101c35;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .detail span {
            color: #666;
            font-size: 14px;
        }

        .application-actions {
            display: flex;
            gap: 10px;
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            flex-wrap: wrap;
        }

        .action-button {
            border: 0;
            padding: 11px 17px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: .2s;
        }

        .action-button:hover {
            transform: translateY(-1px);
            opacity: .92;
        }

        .approve-button {
            background: #176b35;
            color: white;
        }

        .reject-button {
            background: #fff0f0;
            color: #9d2020;
        }

        .featured-button {
            background: #f4e8b8;
            color: #765900;
        }

        .featured-remove-button {
            background: #fff4d6;
            color: #8a6200;
        }

        .delete-button {
            background: #eee;
            color: #333;
        }

        .empty-state {
            background: white;
            padding: 50px 20px;
            text-align: center;
            border-radius: 16px;
            color: #777;
        }

        .message {
            display: none;
            margin-bottom: 20px;
            padding: 14px;
            border-radius: 10px;
        }

        .message.success {
            display: block;
            background: #eaf7ee;
            color: #176b35;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #9d2020;
        }

        @media (max-width: 700px) {

            .admin-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .application-top {
                flex-direction: column;
            }

            .application-details {
                grid-template-columns: 1fr;
            }

            .application-actions {
                flex-direction: column;
            }

            .action-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <div class="container header-content">

        <a href="index.html" class="logo">
            <span>TRABZON</span>
            <strong>ANLIK</strong>
        </a>

        <div class="admin-logo">
            YÖNETİM PANELİ
        </div>

    </div>
</header>


<main class="admin-page">

    <div class="container">

        <div class="admin-header">

            <div>
                <h1>İşletme Başvuruları</h1>

                <p>
                    Trabzon Anlık'a gönderilen işletme
                    başvurularını yönet.
                </p>
            </div>

            <button
                class="refresh-button"
                id="refreshButton"
            >
                ↻ Yenile
            </button>

        </div>


        <div
            id="adminMessage"
            class="message"
        ></div>


        <div
            id="applications"
            class="applications"
        >

            <div class="empty-state">
                Başvurular yükleniyor...
            </div>

        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="admin.js?v=2"></script>

</body>
</html>
```
