<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Yönetim Paneli | Trabzon Anlık</title>
    <link
        rel="stylesheet"
        href="style.css"
    >
    <style>
        /* =========================
           ADMIN GENEL
        ========================= */
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }
        .admin-header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .admin-message {
            margin: 15px 0;
            padding: 12px 15px;
            border-radius: 10px;
            display: none;
        }
        .admin-message.success {
            background: #e8f7ed;
            color: #18743a;
        }
        .admin-message.error {
            background: #fdecec;
            color: #a32121;
        }
        .admin-message.info {
            background: #eef4ff;
            color: #2457a6;
        }
        /* =========================
           LOGIN
        ========================= */
        #loginScreen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 10px 40px rgba(0,0,0,.10);
        }
        .login-box h1 {
            margin-bottom: 8px;
        }
        .login-box p {
            margin-bottom: 25px;
            opacity: .7;
        }
        .login-box label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }
        .login-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }
        .login-box button {
            width: 100%;
            border: 0;
            padding: 13px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
        }
        #loginError {
            display: none;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            background: #fdecec;
            color: #a32121;
        }
        /* =========================
           İŞLETME KARTI
        ========================= */
        .application-card {
            margin-bottom: 25px;
            padding: 22px;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 6px 25px rgba(0,0,0,.08);
        }
        .application-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 18px;
        }
        .application-header h3 {
            margin: 0 0 8px;
            font-size: 21px;
        }
        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        .status.approved {
            background: #e8f7ed;
            color: #18743a;
        }
        .status.pending {
            background: #fff4d6;
            color: #8a6100;
        }
        .business-rating {
            font-weight: 700;
            white-space: nowrap;
        }
        .application-info {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px 20px;
            margin-bottom: 22px;
        }
        .application-info p {
            margin: 0;
            line-height: 1.5;
            word-break: break-word;
        }
        /* =========================
           GALERİ
        ========================= */
        .admin-gallery {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .admin-gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .admin-gallery-header h4 {
            margin: 0;
            font-size: 17px;
        }
        .admin-gallery-header span {
            font-size: 13px;
            opacity: .65;
        }
        .admin-gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }
        .admin-gallery-item {
            min-width: 0;
            overflow: hidden;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            background: #fafafa;
        }
        .admin-image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #eee;
            overflow: hidden;
        }
        .admin-image-wrapper img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }
        .cover-badge {
            position: absolute;
            left: 7px;
            top: 7px;
            padding: 5px 8px;
            border-radius: 20px;
            background: rgba(0,0,0,.75);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
        }
        .admin-image-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            padding: 7px;
        }
        .admin-image-actions button {
            flex: 1;
            min-width: 35px;
            border: 0;
            padding: 7px 6px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            background: #eee;
        }
        .admin-image-actions button:hover {
            opacity: .85;
        }
        .admin-image-actions button:disabled {
            cursor: not-allowed;
            opacity: .4;
        }
        .admin-image-actions .image-delete-button {
            background: #ffe8e8;
            color: #a32121;
        }
        .admin-upload-area {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
            padding: 14px;
            border: 1px dashed #ccc;
            border-radius: 12px;
            background: #fafafa;
        }
        .admin-upload-area input[type="file"] {
            flex: 1;
            min-width: 220px;
            font-size: 13px;
        }
        .admin-upload-area button {
            border: 0;
            padding: 11px 15px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
        }
        .admin-gallery-empty {
            padding: 20px;
            text-align: center;
            border: 1px dashed #ddd;
            border-radius: 12px;
            opacity: .65;
            margin-bottom: 15px;
        }
        /* =========================
           İŞLETME BUTONLARI
        ========================= */
        .application-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: 20px;
        }
        .application-actions button {
            border: 0;
            padding: 10px 13px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
        }
        .approve-button {
            background: #e8f7ed;
            color: #18743a;
        }
        .reject-button {
            background: #fff0e8;
            color: #a34c16;
        }
        .delete-button {
            background: #ffe8e8;
            color: #a32121;
        }
        .featured-button {
            background: #fff4d6;
            color: #8a6100;
        }
        .featured-remove-button {
            background: #f0eaff;
            color: #6140a0;
        }
        /* =========================
           YORUMLAR
        ========================= */
        .review-card {
            margin-bottom: 15px;
            padding: 18px;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 4px 18px rgba(0,0,0,.06);
        }
        .review-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 10px;
        }
        .review-header strong {
            display: block;
        }
        .review-header span {
            display: block;
            margin-top: 3px;
            font-size: 13px;
            opacity: .65;
        }
        .review-card p {
            margin: 10px 0;
            line-height: 1.6;
        }
        .review-card small {
            opacity: .6;
        }
        .review-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
        }
        .review-actions button {
            border: 0;
            padding: 9px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }
        .approved-label {
            padding: 8px 11px;
            border-radius: 8px;
            background: #e8f7ed;
            color: #18743a;
            font-size: 13px;
            font-weight: 700;
        }
        /* =========================
           YÜKLENİYOR / BOŞ
        ========================= */
        .loading,
        .empty,
        .error {
            padding: 25px;
            text-align: center;
            border-radius: 12px;
        }
        .loading {
            background: #f5f5f5;
        }
        .empty {
            background: #fafafa;
            opacity: .7;
        }
        .error {
            background: #fdecec;
            color: #a32121;
        }
        /* =========================
           MOBİL
        ========================= */
        @media (max-width: 800px) {
            .admin-gallery-grid {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }
        }
        @media (max-width: 600px) {
            .admin-container {
                padding: 12px;
            }
            .application-card {
                padding: 15px;
                border-radius: 14px;
            }
            .application-info {
                grid-template-columns: 1fr;
            }
            .application-header {
                flex-direction: column;
            }
            .admin-gallery-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }
            .admin-upload-area {
                align-items: stretch;
            }
            .admin-upload-area input[type="file"],
            .admin-upload-area button {
                width: 100%;
                box-sizing: border-box;
            }
            .application-actions {
                flex-direction: column;
            }
            .application-actions button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- =========================
         LOGIN
    ========================= -->
    <section id="loginScreen">
        <div class="login-box">
            <h1>TRABZON ANLIK</h1>
            <p>
                Yönetim paneline giriş yap
            </p>
            <div id="loginError"></div>
            <form id="loginForm">
                <label for="loginEmail">
                    E-posta
                </label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="E-posta adresiniz"
                    autocomplete="email"
                    required
                >
                <label for="loginPassword">
                    Şifre
                </label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Şifreniz"
                    autocomplete="current-password"
                    required
                >
                <button
                    type="submit"
                >
                    Giriş Yap
                </button>
            </form>
        </div>
    </section>
    <!-- =========================
         ADMIN PANEL
    ========================= -->
    <section
        id="adminApp"
        style="display:none;"
    >
        <div class="admin-container">
            <!-- HEADER -->
            <header class="admin-header">
                <div>
                    <h1>
                        TRABZON ANLIK
                    </h1>
                    <p>
                        YÖNETİM PANELİ
                    </p>
                </div>
                <div class="admin-header-actions">
                    <span id="adminUser"></span>
                    <button
                        id="refreshButton"
                        type="button"
                    >
                        🔄 Yenile
                    </button>
                    <button
                        id="logoutButton"
                        type="button"
                    >
                        Çıkış Yap
                    </button>
                </div>
            </header>
            <!-- MESAJ -->
            <div
                id="adminMessage"
                class="admin-message"
            ></div>
            <!-- =========================
                 İŞLETMELER
            ========================= -->
            <section>
                <h2>
                    İşletmeler
                </h2>
                <div id="applications">
                    <div class="loading">
                        İşletmeler yükleniyor...
                    </div>
                </div>
            </section>
            <!-- =========================
                 YORUMLAR
            ========================= -->
            <section>
                <h2>
                    Yorumlar
                </h2>
                <div id="reviewsList">
                    <div class="loading">
                        Yorumlar yükleniyor...
                    </div>
                </div>
            </section>
        </div>
    </section>
    <!-- SUPABASE -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>
    <!-- ADMIN JS -->
    <script
        src="admin.js?v=4"
    ></script>
</body>
</html>
